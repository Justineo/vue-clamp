  "@vitest/browser-playwright": 5.0.1
  "@vue-macros/define-render": ^3.1.4
  "@vue/compiler-dom": ^3.5.42
  "@vue/compiler-sfc": ^3.5.42
  bumpp: ^12.2.3
  overlayscrollbars: ^2.15.1
  playwright: ^1.62.1
  releaselog: ^8.1.0
  shiki: ^4.4.3
  simple-icons: ^16.29.0
  stats.js: ^0.17.0
  typescript: npm:typescript-native-bridge@6.0.3-bridge.17.tsgo.7.0.2
  unplugin-vue: ^8.0.0
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
